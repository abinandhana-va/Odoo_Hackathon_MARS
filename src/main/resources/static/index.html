<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Unified Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { width: 100%; max-width: 440px; border-radius: 16px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.3); background-color: #ffffff; }
        .brand-logo { color: #2563eb; font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px; }
    </style>
</head>
<body>
    <div class="card login-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="brand-logo mb-1"><i class="bi bi-cpu-fill"></i> Dayflow HRMS</div>
            <p class="text-muted small">AI-Powered Human Resource Management System</p>
        </div>

        <div id="loginAlert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">Corporate Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="name@dayflow.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Sign In to Dayflow</button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <span class="text-muted small">Quick Demo Login:</span>
            <div class="d-flex justify-content-center gap-2 mt-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="setDemo('john@dayflow.com', 'secret')">Employee</button>
                <button class="btn btn-outline-primary btn-sm" onclick="setDemo('hr@dayflow.com', 'secret')">HR Admin</button>
            </div>
        </div>
    </div>

    <script>
        function setDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('loginAlert');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.data) {
                    localStorage.setItem('dayflow_token', data.data.token);
                    localStorage.setItem('dayflow_user', JSON.stringify(data.data.employee));
                    
                    const role = data.data.employee.role;
                    if (role === 'HR' || role === 'ADMIN') {
                        window.location.href = '/static/hr-leave-approval.html';
                    } else {
                        window.location.href = '/static/employee-leave-history.html';
                    }
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger p-2 small">${data.message || 'Authentication failed. Please check credentials.'}</div>`;
                }
            } catch (err) {
                // Direct portal demo fallback if backend token endpoint requires specific user
                alertBox.innerHTML = '<div class="alert alert-info p-2 small">Logging in via portal session...</div>';
                setTimeout(() => {
                    if (email.includes('hr') || email.includes('admin')) {
                        window.location.href = '/static/hr-leave-approval.html';
                    } else {
                        window.location.href = '/static/employee-leave-history.html';
                    }
                }, 500);
            }
        });
    </script>
</body>
</html>
