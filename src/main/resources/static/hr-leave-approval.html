<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - HR Leave Approval Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-warm: #fbfbf9;
            --soft-mint: #e6f4ea;
            --mint-dark: #059669;
            --sage-green: #d1fae5;
            --sage-dark: #047857;
            --pastel-teal: #ccfbf1;
            --teal-dark: #0f766e;
            --powder-blue: #e0f2fe;
            --blue-dark: #0369a1;
            --warm-cream: #fef3c7;
            --cream-dark: #d97706;
            --soft-peach: #ffedd5;
            --peach-dark: #ea580c;
            --blush-pink: #fce7f3;
            --pink-dark: #be185d;
        }

        body { background-color: var(--bg-warm); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #334155; }
        .navbar { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card { border-radius: 14px; border: 1px solid rgba(226, 232, 240, 0.7); box-shadow: 0 4px 14px rgba(0,0,0,0.03); background-color: #ffffff; }

        .badge-PENDING { background-color: var(--warm-cream); color: var(--cream-dark); border: 1px solid #fcd34d; font-weight: 700; }
        .badge-APPROVED { background-color: var(--soft-mint); color: var(--mint-dark); border: 1px solid #a7f3d0; font-weight: 700; }
        .badge-REJECTED { background-color: var(--blush-pink); color: var(--pink-dark); border: 1px solid #fbcfe8; font-weight: 700; }

        .btn-approve { background-color: var(--mint-dark); color: #ffffff; border: none; font-weight: 600; border-radius: 8px; }
        .btn-approve:hover { background-color: #047857; color: #ffffff; }
        .btn-reject { background-color: var(--pink-dark); color: #ffffff; border: none; font-weight: 600; border-radius: 8px; }
        .btn-reject:hover { background-color: #9d174d; color: #ffffff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-4">
                <a class="navbar-brand fw-bold m-0 fs-4" href="#"><i class="bi bi-flower1"></i> Dayflow HRMS</a>
                <div class="d-flex gap-3 text-white-50 small fw-bold">
                    <a class="text-white text-decoration-none" href="/static/hr-leave-approval.html">Leave Approvals</a>
                    <a class="text-white-50 text-decoration-none hover:text-white" href="/static/payroll-dashboard.html">Payroll Dashboard</a>
                    <a class="text-white-50 text-decoration-none hover:text-white" href="/static/ai-assistant.html">AI Assistant</a>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text text-light small">HR / Admin Portal</span>
                <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark m-0"><i class="bi bi-check2-square"></i> Leave Approval Workflow</h4>
                <p class="text-muted small m-0">Review, search, approve, or reject employee leave requests</p>
            </div>
            <div class="d-flex gap-2">
                <select id="statusFilter" class="form-select rounded-3" style="width: 160px;" onchange="loadLeaveRequests()">
                    <option value="ALL">All Statuses</option>
                    <option value="PENDING" selected>PENDING</option>
                    <option value="APPROVED">APPROVED</option>
                    <option value="REJECTED">REJECTED</option>
                </select>
                <button class="btn btn-outline-secondary rounded-pill px-3" onclick="loadLeaveRequests()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
        </div>

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Request ID</th>
                            <th>Employee Name</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Reason</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaveRequestsBody">
                        <tr><td colspan="9" class="text-center text-muted">Loading requests...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Action Modal -->
    <div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: 14px;">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="actionModalTitle">Decision</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalRequestId">
                    <input type="hidden" id="modalTargetStatus">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Admin Comment (Optional)</label>
                        <textarea id="modalComment" class="form-control rounded-3" rows="3" placeholder="Enter reason for approval or rejection..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-3" id="confirmDecisionBtn" onclick="submitDecision()">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let actionModal;
        document.addEventListener('DOMContentLoaded', () => {
            actionModal = new bootstrap.Modal(document.getElementById('actionModal'));
            loadLeaveRequests();
        });

        async function loadLeaveRequests() {
            const status = document.getElementById('statusFilter').value;
            const url = (status === 'ALL') ? '/api/v1/leaves/all' : '/api/v1/leaves/pending';

            try {
                const res = await fetch(url);
                const result = await res.json();
                const tbody = document.getElementById('leaveRequestsBody');
                tbody.innerHTML = '';

                let dataList = result.data || [];
                if (status !== 'ALL' && status !== 'PENDING') {
                    dataList = dataList.filter(item => item.status === status);
                }

                if (dataList.length > 0) {
                    dataList.forEach(item => {
                        const isPending = item.status === 'PENDING';
                        tbody.innerHTML += `
                            <tr>
                                <td>#${item.id}</td>
                                <td><span class="fw-semibold">${item.employeeName || 'Employee #' + item.employeeId}</span></td>
                                <td><span class="fw-semibold text-uppercase">${item.leaveType}</span></td>
                                <td>${item.startDate}</td>
                                <td>${item.endDate}</td>
                                <td>${item.totalDays}</td>
                                <td><span class="badge badge-${item.status} px-3 py-1 rounded-pill">${item.status}</span></td>
                                <td><small class="text-muted">${item.reason || '-'}</small></td>
                                <td class="text-end">
                                    ${isPending ? `
                                        <button class="btn btn-sm btn-approve me-1" onclick="openDecisionModal(${item.id}, 'APPROVED')">Approve</button>
                                        <button class="btn btn-sm btn-reject" onclick="openDecisionModal(${item.id}, 'REJECTED')">Reject</button>
                                    ` : `<small class="text-muted">Decided</small>`}
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">No leave requests found.</td></tr>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function openDecisionModal(id, targetStatus) {
            document.getElementById('modalRequestId').value = id;
            document.getElementById('modalTargetStatus').value = targetStatus;
            document.getElementById('modalComment').value = '';
            document.getElementById('actionModalTitle').innerText = (targetStatus === 'APPROVED' ? 'Approve Leave Request' : 'Reject Leave Request');

            const btn = document.getElementById('confirmDecisionBtn');
            if (targetStatus === 'APPROVED') {
                btn.className = 'btn btn-approve rounded-3 px-4';
            } else {
                btn.className = 'btn btn-reject rounded-3 px-4';
            }

            actionModal.show();
        }

        async function submitDecision() {
            const id = document.getElementById('modalRequestId').value;
            const targetStatus = document.getElementById('modalTargetStatus').value;
            const comment = document.getElementById('modalComment').value;

            const payload = {
                status: targetStatus,
                adminComment: comment
            };

            try {
                const res = await fetch('/api/v1/leaves/' + id + '/approve', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    actionModal.hide();
                    loadLeaveRequests();
                } else {
                    alert('Action failed.');
                }
            } catch (err) {
                alert('Error submitting decision.');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/static/index.html';
        }
    </script>
</body>
</html>
