# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=dayflow-hrms

# Default In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:dayflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SpringDoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# JWT Security Config
app.jwt.secret=9a2f8c4e7b1d3f6a8e0c2b5d7e9f1a3c5b7d9e1f3a5c7b9d2e4f6a8c0b2d4e6f
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.dayflow=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
